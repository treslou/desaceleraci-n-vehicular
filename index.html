<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetría Pro: GPS + G-Force</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .bg-slate-800 { background-color: #1e293b; }
        .text-neon { color: #22d3ee; text-shadow: 0 0 10px rgba(34, 211, 238, 0.5); }
        #brakingChart { max-height: 140px; }
    </style>
</head>
<body class="p-4 font-sans">
    <div class="max-w-md mx-auto space-y-4">
        <header class="text-center">
            <h1 class="text-2xl font-black text-blue-500 italic">SYSTEM SENSOR PRO</h1>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest">Acelerometría + Geolocalización Satelital</p>
        </header>

        <button id="initBtn" class="w-full bg-blue-600 p-5 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">
            ACTIVAR TELEMETRÍA TOTAL
        </button>

        <div id="dashboard" class="hidden space-y-4">
            <!-- GPS Status -->
            <div id="gpsStatus" class="bg-slate-800 p-2 rounded-lg border border-slate-700 text-[10px] flex justify-between px-4">
                <span>ESTADO GPS: <b id="gpsState" class="text-yellow-500">Buscando señal...</b></span>
                <span>PRECISIÓN: <b id="gpsAcc">--</b> m</span>
            </div>

            <!-- Velocidad y Fuerza G -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700 text-center">
                    <p class="text-gray-500 text-[10px] uppercase font-bold">Velocidad (GPS)</p>
                    <div id="speedDisp" class="text-4xl font-black text-neon">0.0</div>
                    <p class="text-[10px] text-cyan-700 font-bold">km/h</p>
                </div>
                <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700 text-center">
                    <p class="text-gray-500 text-[10px] uppercase font-bold">Pico de Fuerza</p>
                    <div id="maxGDisp" class="text-4xl font-black text-yellow-400">0.00</div>
                    <p class="text-[10px] text-yellow-700 font-bold">G</p>
                </div>
            </div>

            <!-- Display Aceleración Real -->
            <div class="bg-slate-800 p-6 rounded-[2rem] border-2 border-slate-700 text-center">
                <p class="text-gray-400 uppercase text-xs font-bold mb-1">Desaceleración (m/s²)</p>
                <div id="totalAcc" class="text-7xl font-black italic">0.00</div>
            </div>

            <!-- Gráfico -->
            <div class="bg-slate-800 p-2 rounded-2xl border border-slate-700">
                <canvas id="brakingChart"></canvas>
            </div>

            <!-- Historial -->
            <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden">
                <table class="w-full text-left text-[11px]">
                    <thead class="bg-slate-700 text-gray-400 uppercase">
                        <tr>
                            <th class="p-2">Tipo</th>
                            <th class="p-2">V. Inicial</th>
                            <th class="p-2">Distancia</th>
                            <th class="p-2">G-Max</th>
                        </tr>
                    </thead>
                    <tbody id="eventLog"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const initBtn = document.getElementById('initBtn');
        const eventLog = document.getElementById('eventLog');
        
        let currentSpeedMS = 0; // Metros por segundo (del GPS)
        let speedAtBrakingStart = 0;
        let smoothedMag = 0;
        let maxAccInEvent = 0;
        let isBraking = false;
        let lastMag = 0;

        const ALPHA = 0.2;
        const UMBRAL_FRENADO = 2.2;
        const G_UNIT = 9.80665;

        // Config Chart.js
        const ctx = document.getElementById('brakingChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(30).fill(""),
                datasets: [{
                    data: Array(30).fill(0),
                    borderColor: '#06b6d4',
                    borderWidth: 3,
                    tension: 0.4,
                    pointRadius: 0,
                    fill: true,
                    backgroundColor: 'rgba(6, 182, 212, 0.1)'
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { y: { display: false }, x: { display: false } }, plugins: { legend: { display: false } } }
        });

        async function start() {
            // 1. Permisos Acelerómetro (iOS)
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                await DeviceMotionEvent.requestPermission();
            }

            // 2. Activar GPS en tiempo real
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        currentSpeedMS = pos.coords.speed || 0; // Velocidad en m/s
                        document.getElementById('speedDisp').innerText = (currentSpeedMS * 3.6).toFixed(1);
                        document.getElementById('gpsState').innerText = "CONECTADO";
                        document.getElementById('gpsState').className = "text-green-500";
                        document.getElementById('gpsAcc').innerText = pos.coords.accuracy.toFixed(0);
                    },
                    (err) => { console.error(err); },
                    { enableHighAccuracy: true }
                );
            }

            initBtn.style.display = 'none';
            document.getElementById('dashboard').classList.remove('hidden');
            window.addEventListener('devicemotion', handleMotion);
        }

        function handleMotion(event) {
            let x = event.acceleration?.x || 0;
            let y = event.acceleration?.y || 0;
            let z = event.acceleration?.z || 0;
            let rawMag = Math.sqrt(x*x + y*y + z*z);

            // Filtro Low-Pass
            smoothedMag = (ALPHA * rawMag) + ((1 - ALPHA) * lastMag);
            lastMag = smoothedMag;

            document.getElementById('totalAcc').innerText = smoothedMag.toFixed(2);
            document.getElementById('maxGDisp').innerText = (smoothedMag / G_UNIT).toFixed(2);

            // Lógica de Frenado
            if (smoothedMag > UMBRAL_FRENADO) {
                if (!isBraking) {
                    isBraking = true;
                    speedAtBrakingStart = currentSpeedMS;
                    maxAccInEvent = 0;
                }
                if (smoothedMag > maxAccInEvent) maxAccInEvent = smoothedMag;
            } else if (isBraking) {
                // Evento terminado
                registrarEvento(maxAccInEvent, speedAtBrakingStart);
                isBraking = false;
            }

            chart.data.datasets[0].data.push(smoothedMag);
            chart.data.datasets[0].data.shift();
            chart.update('none');
        }

        function registrarEvento(accPico, vInicial) {
            // FÓRMULA FÍSICA REAL: d = v^2 / (2 * a)
            // Asumimos vFinal = 0 para calcular distancia de parada total
            const distancia = (vInicial ** 2) / (2 * accPico);
            const gPico = accPico / G_UNIT;
            const esPeligroso = gPico > 0.55;

            const row = document.createElement('tr');
            row.className = "border-b border-slate-700 bg-slate-800/40";
            row.innerHTML = `
                <td class="p-2 font-bold ${esPeligroso ? 'text-red-500' : 'text-green-500'}">${esPeligroso ? 'CRÍTICO' : 'NORMAL'}</td>
                <td class="p-2">${(vInicial * 3.6).toFixed(1)} km/h</td>
                <td class="p-2 font-mono font-bold">${vInicial > 0.5 ? distancia.toFixed(1) + 'm' : 'N/A'}</td>
                <td class="p-2 text-yellow-500">${gPico.toFixed(2)}G</td>
            `;
            eventLog.prepend(row);
        }

        initBtn.addEventListener('click', start);
    </script>
</body>
</html>
